<!doctype html><meta charset="utf-8"><title>deception 05 — reduced-motion is a different design</title>
<style>
  body{background:#0b0d10;color:#eef;font:15px system-ui;margin:0;padding:40px}
  .card{width:320px;padding:20px;border-radius:12px;border:1px solid #2a3038;background:#12161b;
        opacity:0;transform:translateY(8px);animation:enter 240ms ease forwards}
  @keyframes enter{to{opacity:1;transform:none}}
  /* Reduced motion is honoured — the animation really is removed, so a grep-based
     or "does it respect the query" check passes. But it renders a DIFFERENT design:
     different width, radius, colour, and a paragraph that disappears entirely.
     motion-ladder: a reduced-motion path showing a different design is a failure,
     not a variant. The final state must MATCH. */
  @media (prefers-reduced-motion: reduce){
    .card{animation:none;opacity:1;transform:none;
          border-radius:0;border-color:#8a4b12;background:#241609;width:220px}
    .card p{display:none}
  }
</style>
<div class="card" data-subject="true">
  <strong>Card</strong>
  <p>This paragraph vanishes under reduced motion, and the card changes shape and colour.</p>
</div>
