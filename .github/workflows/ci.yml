name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-spreadsheetbench-ci.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement scripts/requirements-spreadsheetbench-ci.txt

      - name: Install dependencies
        run: npm ci

      - name: Verify immutable NodeGym tarball, lock identity, and direct consumer journey
        run: npm run nodegym:consumer:proof

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check commit message accuracy
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run commit:check:range -- "${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            npm run commit:check:range -- "${{ github.event.before }}..HEAD"
          else
            npm run commit:check
          fi

      - name: Production gate
        run: npm run prod:gate

      - name: Ladder eval
        run: npm run ladder

  nodeslide-consumer:
    name: NodeSlide packed consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NodeRoom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: noderoom

      - name: Resolve immutable NodeSlide producer
        id: nodeslide-release
        shell: bash
        run: |
          sha="$(node -p 'require("./noderoom/vendor/nodeslide/release-lock.json").nodeSlideCommit')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout NodeSlide package producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HomenShum/NodeSlide
          ref: ${{ steps.nodeslide-release.outputs.sha }}
          path: nodeslide

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            noderoom/package-lock.json
            nodeslide/package-lock.json

      - name: Install NodeRoom dependencies
        working-directory: noderoom
        run: npm ci

      - name: Install and build NodeSlide packages
        working-directory: nodeslide
        run: |
          npm ci
          npm run packages:build

      - name: Prove NodeSlide publish-shaped package surface
        working-directory: nodeslide
        run: npm run packages:consumer:smoke

      - name: Pack versioned NodeSlide testing dependency closure
        working-directory: nodeslide
        run: |
          mkdir -p "$RUNNER_TEMP/nodeslide-packages"
          npm pack --workspace @nodeslide/contracts --pack-destination "$RUNNER_TEMP/nodeslide-packages"
          npm pack --workspace @nodeslide/engine --pack-destination "$RUNNER_TEMP/nodeslide-packages"
          npm pack --workspace @nodeslide/backend --pack-destination "$RUNNER_TEMP/nodeslide-packages"
          npm pack --workspace @nodeslide/testing --pack-destination "$RUNNER_TEMP/nodeslide-packages"

      - name: Run NodeRoom NodeAgent consumer journey
        working-directory: noderoom
        env:
          NODESLIDE_PACKAGE_ARTIFACT: ${{ runner.temp }}/nodeslide-packages
        run: npm run nodeslide:consumer:proof

      - name: Verify immutable mounted release, exact producer, and full mounted journey
        working-directory: noderoom
        env:
          NODESLIDE_ROOT: ${{ github.workspace }}/nodeslide
        run: npm run nodeslide:mounted:release:proof -- --json-out nodeslide-mounted-release-proof.json

      - name: Upload mounted release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodeslide-mounted-release-${{ github.run_id }}
          path: noderoom/nodeslide-mounted-release-proof.json
          if-no-files-found: error
