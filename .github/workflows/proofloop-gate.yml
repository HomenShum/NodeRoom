# Proof Loop gate -- fails the job unless the persisted proof ledger says "passed".
#
# Installed into a target repo by `proofloop ci install github`, which fills in
# the goal id below. `proofloop gate --goal <id>` exits non-zero unless
# .proofloop/goals/<id>/state.json finalizes to status "passed", so a red gate
# is a red check -- no separate scoring glue needed.
name: proofloop-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proofloop-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      # Goal ledgers are intentionally gitignored because they contain local
      # ProofLoop run state and external-scorer receipts. Run the strict gate
      # when a real ledger is supplied; do not turn a stateless checkout into
      # a misleading "goal does not exist" failure.
      - name: Detect persisted ProofLoop goal ledger
        id: goal-ledger
        shell: bash
        run: |
          if [[ -f .proofloop/goals/official-scores/state.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the Proof Loop gate
        if: steps.goal-ledger.outputs.available == 'true'
        run: npx tsx scripts/proofloop-cli.ts gate --goal official-scores
      - name: Record external ProofLoop boundary
        if: steps.goal-ledger.outputs.available != 'true'
        run: echo "::notice::ProofLoop gate skipped because the persisted official-scores ledger is local-only and absent from this checkout; run the strict gate where the ledger and accepted scorer receipts are available."
