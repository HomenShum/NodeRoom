# Nightly LLM-judge regression over tracked demo media (schedule-only: the judge
# spends Gemini tokens, so it never runs per-push and never blocks a PR).
# Requires the GOOGLE_GENERATIVE_AI_API_KEY repo secret (same secret design-gate.yml
# uses); if it is missing the judge script throws and the job fails honestly.
name: nightly-judge

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  media-judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gemini media judge (primary media set)
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: npm run media:gemini-judge
      - name: Upload judge verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gemini-media-judge-${{ github.run_id }}
          path: docs/eval/gemini-media-judges/**
          if-no-files-found: warn
