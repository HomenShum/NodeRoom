<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NodeAgent — Mobile</title>

<!-- NodeBench AI design tokens -->
<link rel="stylesheet" href="assets/colors_and_type.css" />
<!-- mobile surface -->
<link rel="stylesheet" href="mobile/na.css" />

<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    background:
      radial-gradient(80% 60% at 20% 0%, rgba(217,119,87,0.08), transparent 55%),
      radial-gradient(70% 50% at 100% 100%, rgba(94,106,210,0.06), transparent 50%),
      #0a0a0c;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    overflow: hidden;
  }
  #root { display: grid; place-items: center; }
  @media (max-width: 460px) {
    body { display: block; background: #000; overflow: auto; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- starter components -->
<script type="text/babel" src="mobile/ios-frame.jsx"></script>
<script type="text/babel" src="mobile/tweaks-panel.jsx"></script>

<!-- data -->
<script src="mobile/na-data.js"></script>

<!-- UI (execute in order) -->
<script type="text/babel" src="mobile/na-icons.jsx"></script>
<script type="text/babel" src="mobile/na-screens.jsx"></script>
<script type="text/babel" src="mobile/na-sheets.jsx"></script>
<script type="text/babel" src="mobile/na-chat.jsx"></script>
<script type="text/babel" src="mobile/na-files.jsx"></script>
<script type="text/babel" src="mobile/na-app.jsx"></script>

  </svg>
</template>
</body>
</html>
