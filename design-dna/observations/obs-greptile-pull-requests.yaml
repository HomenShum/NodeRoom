  - low-volume-table

intentTags:
  - report-history-not-host-decisions
  - spend-colour-only-on-verification

layoutTags:
  - full-width-table
  - horizontal-tab-nav
  - no-vertical-stretch

interactionTags:
  - single-sort-column
  - row-multiselect
  - search-and-filter-in-one-field

